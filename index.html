<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="일상에서 발견한 UX를 기록하고 탐색하는 아카이브" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2318171b'/%3E%3Cpath d='M16 17v20a16 16 0 0032 0V17h-7v20a9 9 0 01-18 0V17z' fill='%23ff5c35'/%3E%3C/svg%3E" />
  <title>UX 아카이브</title>
  <style>
    @font-face { font-family:Pretendard; src:url('./assets/PretendardVariable.ttf') format('truetype'); font-weight:45 920; font-display:swap; }
    :root { --ink:#171717; --muted:#686868; --line:#d8d8d5; --paper:#f5f5f2; --panel:#fff; --soft:#efefec; --accent:#171717; }
    * { box-sizing:border-box } body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.7 Pretendard, "Pretendard Variable", -apple-system, BlinkMacSystemFont, sans-serif; letter-spacing:0; }
    button, input { font:inherit } button { cursor:pointer }
    .wrap { width:min(1200px, calc(100% - 48px)); margin:auto }
    header { border-bottom:1px solid var(--line) } .top { padding:22px 0; border-bottom:1px solid var(--line) }
    .brand { font-size:1rem; font-weight:720; letter-spacing:-.015em }
    .hero { display:grid; grid-template-columns:minmax(0,1fr) minmax(290px,.72fr); gap:80px; padding:72px 0 62px; align-items:start }
    h1 { margin:0; max-width:680px; font-size:clamp(2.75rem, 5.3vw, 5.5rem); line-height:1.18; letter-spacing:-.035em; font-weight:700 }
    .intro { margin:8px 0 0; max-width:390px; color:#424242; font-size:1.05rem; line-height:1.78; word-break:keep-all }
    main { padding:34px 0 88px } .tools { display:grid; grid-template-columns:minmax(240px,370px) 1fr; gap:18px 28px; align-items:center; margin-bottom:34px; padding-bottom:22px; border-bottom:1px solid var(--line) }
    .search { min-width:0; width:100%; padding:12px 0; border:0; border-bottom:1px solid var(--ink); border-radius:0; background:transparent; outline-offset:5px }
    .filters { grid-column:1/-1; display:flex; flex-wrap:nowrap; gap:8px; overflow-x:auto; padding:3px 1px 11px; scrollbar-width:none; -webkit-overflow-scrolling:touch }.filters::-webkit-scrollbar{display:none}.filter { flex:0 0 auto; border:1px solid transparent; background:#e9e9e6; border-radius:999px; padding:8px 13px; color:#555; font-size:.84rem; font-weight:570; line-height:1.25; letter-spacing:-.01em; transition:background .18s,color .18s,border .18s,transform .18s }.filter:hover { background:#ddddda; color:var(--ink) }.filter[aria-pressed="true"] { background:var(--ink); border-color:var(--ink); color:#fff; font-weight:680 }.filter:focus-visible { outline:2px solid var(--ink); outline-offset:3px }
    .grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:34px 18px }.card { cursor:pointer; overflow:hidden; background:transparent; border:0; border-radius:0; min-height:0; display:flex; flex-direction:column; opacity:0; transform:translateY(16px); transition:transform .35s cubic-bezier(.2,.75,.25,1), opacity .35s }.card.in { opacity:1; transform:translateY(0) }.card:hover { transform:translateY(-4px) }.card:focus-visible { outline:2px solid var(--ink); outline-offset:5px }.image-wrap { aspect-ratio:4/3; height:auto; overflow:hidden; background:var(--soft) }.card-img { width:100%; height:100%; object-fit:cover; transition:transform .6s cubic-bezier(.2,.75,.25,1) }.card:hover .card-img { transform:scale(1.035) }.card-body { padding:15px 1px 0; display:flex; flex:1; flex-direction:column }
    .meta { display:flex; gap:6px; align-items:center; font-size:.78rem; line-height:1.4; color:var(--muted); margin-bottom:auto }.chip { padding:0; border-radius:0; color:inherit; background:transparent; font-weight:560 }.chip::after { content:'·'; margin-left:6px }.chip.bad,.chip.question { background:transparent }
    h2 { font-size:1.28rem; line-height:1.48; letter-spacing:-.017em; margin:11px 0 7px; font-weight:670; word-break:keep-all }.card p { margin:0; color:#656565; font-size:.93rem; line-height:1.66; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden }.card-actions { margin-top:14px; display:flex; justify-content:flex-end }.open { width:31px; height:31px; display:grid; place-items:center; text-align:center; border:1px solid var(--line); border-radius:50%; padding:0; color:var(--ink); background:transparent; font-size:0; transition:background .18s,color .18s,border .18s }.open::before { content:'↗'; font-size:1rem; line-height:1 }.card:hover .open,.open:hover { background:var(--ink); color:#fff; border-color:var(--ink) }
    .empty { display:none; grid-column:1/-1; padding:60px 0; text-align:center; color:var(--muted) }
    dialog { width:min(680px, calc(100% - 32px)); border:0; border-radius:0; padding:0; color:var(--ink); box-shadow:0 20px 80px #0005 } dialog::backdrop { background:#16161677 } .modal { padding:32px }.close { float:right; border:1px solid var(--line); border-radius:50%; width:34px; height:34px; background:#fff; font-size:1.25rem }.modal h2 { margin:22px 0 14px; font-size:2rem; line-height:1.4; letter-spacing:-.02em }.modal .body { color:#4f4f4f; white-space:pre-line; font-size:1rem; line-height:1.8 }.modal .meta { margin-top:20px }.modal-img { display:block; width:100%; height:auto; border-radius:0; margin:18px 0 4px }
    @media (max-width:780px) { .wrap{width:min(100% - 32px,1200px)} .hero{grid-template-columns:1fr;gap:28px;padding:46px 0}.grid{grid-template-columns:1fr;gap:34px}.top{padding:18px 0}.tools{display:block}.filters{margin-top:16px;padding-bottom:8px}.search{max-width:none}h1{font-size:clamp(2.4rem,10vw,4.2rem)}.modal{padding:22px} }

    /* v2 — archive as an explorable field */
    .v2 { background:#ecece8; color:#171717; overflow-x:hidden }
    .atlas { display:grid; grid-template-columns:330px minmax(0,1fr); min-height:100vh; max-width:none; width:100% }
    .navigator { position:sticky; top:0; height:100vh; display:flex; flex-direction:column; padding:28px 26px 24px; background:#161616; color:#f2f2ee; border-right:1px solid #333 }
    .wordmark { display:inline-block; width:max-content; color:inherit; font-size:1.2rem; line-height:.86; font-weight:800; letter-spacing:-.07em; text-decoration:none }.wordmark span { display:block; margin-top:8px; color:#a2a29c; font-size:.55rem; letter-spacing:.1em; font-weight:600 }
    .nav-copy { margin:clamp(44px,8vh,90px) 0 28px }.eyebrow { color:#a7a7a0; font-size:.63rem; letter-spacing:.14em; font-weight:680; margin:0 0 12px }.nav-copy h1 { color:#f2f2ee; font-size:clamp(2rem,3.1vw,3rem); line-height:1.06; letter-spacing:-.055em; margin:0; font-weight:680 }.nav-copy p:last-child { max-width:240px; margin:20px 0 0; color:#bbbcb6; font-size:.87rem; line-height:1.72; word-break:keep-all }
    .search-shell { display:flex; align-items:center; gap:9px; border-bottom:1px solid #70716b; padding:0 0 10px; color:#d9d9d3 }.search-shell span { font-size:1.25rem; line-height:1 }.search-shell input { width:100%; min-width:0; background:transparent; color:#fff; border:0; outline:0; font:inherit; font-size:.9rem }.search-shell input::placeholder { color:#8e8f89 }
    .v2 .filters { display:flex; flex-direction:column; overflow:auto; gap:0; margin:20px -7px 0; padding:0 7px; scrollbar-width:thin; scrollbar-color:#555 transparent }.v2 .filter { position:relative; width:100%; display:flex; justify-content:space-between; border:0; border-radius:0; background:transparent; color:#a7a7a0; padding:8px 0; font-size:.83rem; font-weight:520; text-align:left; transition:color .2s, padding .2s }.v2 .filter::after { content:'↗'; opacity:0; transform:translateX(-6px); transition:.2s }.v2 .filter:hover { background:transparent; color:#fff; padding-left:6px }.v2 .filter[aria-pressed="true"] { background:transparent; color:#fff; font-weight:700; padding-left:8px }.v2 .filter[aria-pressed="true"]::before { content:''; position:absolute; left:0; top:50%; width:3px; height:3px; border-radius:50%; transform:translateY(-50%); background:#fff }.v2 .filter[aria-pressed="true"]::after,.v2 .filter:hover::after { opacity:1; transform:none }
    .nav-footer { margin-top:auto; border-top:1px solid #3d3e39; padding-top:18px }.nav-footer p { margin:0; color:#898a85; font-size:.7rem; letter-spacing:.02em }
    .field { min-width:0; padding:28px clamp(24px,4vw,70px) 88px; background:linear-gradient(118deg,#f3f3ef 0%,#e5e5e0 100%) }.field-head { display:flex; justify-content:space-between; align-items:center; gap:20px; margin:0 0 34px; padding-bottom:13px; border-bottom:1px solid #bfc0b9; color:#62635e; font-size:.82rem }.field-head p { margin:0 }.field-head p:first-child { color:#171717; font-weight:670; letter-spacing:-.015em }
    .v2 .grid { display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); grid-auto-flow:dense; gap:clamp(14px,1.65vw,25px); align-items:start }.v2 .card { grid-column:span 4; min-width:0; position:relative; background:transparent; opacity:1; transform:none; transition:transform .35s cubic-bezier(.2,.75,.25,1) }.v2 .card:nth-child(7n+1) { grid-column:span 8 }.v2 .card:nth-child(7n+1) .image-wrap { aspect-ratio:16/9 }.v2 .card:nth-child(7n+4) { grid-column:span 5 }.v2 .card:nth-child(7n+4) .image-wrap { aspect-ratio:4/5 }.v2 .card:nth-child(7n+6) { grid-column:span 3 }.v2 .card:nth-child(7n+6) .image-wrap { aspect-ratio:3/4 }.v2 .card:hover { transform:translateY(-8px) }.v2 .image-wrap { aspect-ratio:1/1; background:#d5d5cf; overflow:hidden }.v2 .card-img { filter:saturate(.92); transition:transform .65s cubic-bezier(.2,.75,.25,1),filter .3s }.v2 .card:hover .card-img { transform:scale(1.055); filter:saturate(1.05) }.v2 .card-body { padding:12px 2px 0 }.v2 .meta { margin:0; min-height:auto; color:#686963; font-size:.7rem; letter-spacing:.01em }.v2 .chip { font-weight:700 }.v2 h2 { margin:8px 0 4px; font-size:clamp(1.1rem,1.6vw,1.45rem); line-height:1.3; letter-spacing:-.04em }.v2 .card p { display:none }.v2 .card-actions { position:absolute; top:10px; right:10px; margin:0; opacity:0; transition:opacity .2s }.v2 .card:hover .card-actions { opacity:1 }.v2 .open { background:#fff; border-color:#fff }
    .v2 dialog { width:min(1000px,calc(100% - 36px)); background:#f8f8f5; box-shadow:0 28px 120px #0008 }.v2 .modal { position:relative; display:grid; grid-template-columns:minmax(0,1.14fr) minmax(260px,.86fr); gap:0; padding:0 }.v2 .modal-img { grid-row:1/5; width:100%; max-height:calc(100vh - 80px); margin:0; object-fit:contain; background:#e5e5df }.v2 .modal .meta,.v2 .modal h2,.v2 .modal .body,.v2 .modal .takeaway { grid-column:2; margin-left:clamp(24px,3vw,42px); margin-right:clamp(24px,3vw,42px) }.v2 .modal .meta { margin-top:48px }.v2 .modal h2 { margin-top:18px; margin-bottom:18px; font-size:clamp(1.8rem,3vw,2.8rem); line-height:1.15 }.v2 .modal .body { margin-top:0; font-size:.98rem; line-height:1.84; color:#3d3d39; white-space:normal }.v2 .takeaway { padding-top:20px; border-top:1px solid #cbcbc5; color:#575852; font-size:.88rem; line-height:1.7 }.v2 .takeaway strong { display:block; margin-bottom:5px; color:#181818; font-size:.69rem; letter-spacing:.1em }.v2 .close { position:absolute; z-index:1; top:12px; right:12px; background:#fff }
    @media (max-width:900px) { .atlas { grid-template-columns:270px minmax(0,1fr) }.navigator { padding:24px 20px }.nav-copy h1 { font-size:2.05rem }.v2 .card { grid-column:span 6 }.v2 .card:nth-child(7n+1) { grid-column:span 12 }.v2 .card:nth-child(7n+4) { grid-column:span 6 }.v2 .card:nth-child(7n+6) { grid-column:span 6 }.v2 .modal { grid-template-columns:1fr }.v2 .modal-img { grid-row:auto; max-height:60vh }.v2 .modal .meta,.v2 .modal h2,.v2 .modal .body,.v2 .modal .takeaway { grid-column:auto }.v2 .modal .meta { margin-top:28px }.v2 .modal .takeaway { margin-bottom:32px } }
    @media (max-width:680px) { .atlas { display:block }.navigator { position:relative; height:auto; min-height:0; padding:22px 18px }.nav-copy { margin:42px 0 24px }.nav-copy h1 { font-size:2.15rem }.v2 .filters { display:grid; grid-template-columns:1fr 1fr; gap:0 20px; max-height:none; margin:18px 0 16px; padding:0 }.nav-footer { margin-top:12px }.field { padding:20px 18px 56px }.field-head p:last-child { display:none }.v2 .grid { grid-template-columns:1fr 1fr; gap:16px }.v2 .card,.v2 .card:nth-child(7n+1),.v2 .card:nth-child(7n+4),.v2 .card:nth-child(7n+6) { grid-column:span 1 }.v2 .card:nth-child(7n+1) .image-wrap,.v2 .card:nth-child(7n+4) .image-wrap,.v2 .card:nth-child(7n+6) .image-wrap { aspect-ratio:1/1.1 }.v2 h2 { font-size:1.05rem }.v2 .card-actions { display:none } }
  </style>
</head>
<body class="v2">
  <main class="atlas">
    <aside class="navigator" aria-label="아카이브 탐색">
      <a class="wordmark" href="#top">UX<br>ATLAS<span>02</span></a>
      <div class="nav-copy"><p class="eyebrow">FIELD NOTES</p><h1>좋은 경험은<br>의외로 가까이에<br>있었습니다.</h1><p>일상에서 포착한 작은 신호를 따라가며, 사용 경험을 다시 읽었습니다.</p></div>
      <label class="search-shell"><span>⌕</span><input id="search" type="search" placeholder="기록 안에서 찾기" aria-label="기록 안에서 찾기"></label>
      <nav class="filters" id="filters" aria-label="카테고리 필터"></nav>
      <div class="nav-footer"><p id="resultCount"></p></div>
    </aside>
    <section class="field" id="top" aria-live="polite">
      <div class="field-head"><p id="fieldLabel">All observations</p><p>스크롤하거나, 마음 가는 장면을 골라보세요.</p></div>
      <div class="grid" id="grid"></div>
      <div class="empty" id="empty">아직 이 경로에는 기록이 없어요.</div>
    </section>
  </main>
  <dialog id="dialog"><article class="modal"><button class="close" aria-label="닫기">×</button><div id="dialogContent"></div></article></dialog>
  <script>
    const archiveRows = [
      ['신박하지만 무거워서 열기가 힘들어요','Affordance','?','손잡이에 전시에 대한 설명이 적혀 있고, 열면 내용을 볼 수 있다. 신박한 방식이지만 매우 무거워 열기가 힘들다.','전시'],
      ['프라이탁','Signifiers','Good','직접 열지 않아도 어떤 가방인지 알 수 있다. 손잡이를 빼두어 상자를 쉽게 열고 가방을 확인할 수 있다.','제품'],
      ['스위스패스','Signifiers','Good','실시간으로 현재 역과 위치를 알 수 있다. 기차가 연착되면 기존 시간 아래에 변경된 시간을 즉각적으로 알려준다.','교통'],
      ['공항에서 집까지 27분','UX Writing','Good','공항에 도착한 순간 집까지 걸리는 시간을 알려주고, 경로로 바로 연결될 수 있도록 돕는다.','모바일'],
      ['3번 남았구나?','Signifiers','Good','스페인 교통카드 10회권. 몇 번 더 사용할 수 있는지 직관적으로 알려준다.','교통'],
      ['이메일이요?','UX Writing','bad','전화번호를 입력하는 화면인데 이메일 주소를 입력하라고 안내한다. 작은 오타가 큰 혼란을 만든다.','모바일'],
      ['트램에서도 티켓을 구매하세요','Accessibility','Good','티켓을 사는 것을 놓쳤지만 급하게 타야 하는 사람을 위해 트램 안에서도 구매할 수 있다. 모든 상황을 고려한다.','교통'],
      ['땅콩 알러지 출입금지','Signifiers','Good','FIVE GUYS는 땅콩 기름을 쓴다. 땅콩을 수북하게 배치하고 간식을 제공해 알레르기 위험을 온몸으로 알린다.','공간'],
      ['길을 잃었다','Signifiers','bad','앞으로 가야 한다는 표시지만 놀랍게도 오른쪽으로 가야 한다. 실제로 이 화살표 때문에 길을 잃었다.','공간'],
      ['친절한 구글지도씨','Forgiveness','Good','경로를 설정한 뒤 뒤로 가기를 누르면, 경로를 종료할 것인지 친절하게 확인해준다.','모바일'],
      ['3일을 선택했는데 왜 4일이?','Feedback','bad','화면에서는 13일을 선택했는데 요약에는 14일이 표시된다. 시차로 보이지만 구매 오류로 이어질 수 있는 심각한 피드백 문제다.','웹'],
      ['Wizz air 비행기 티켓','Hierarchy','Good','정보의 중요도에 따라 잘 정리된 티켓. 좌석·탑승구·수하물 정보를 이해하기 쉽게 보여준다.','모바일'],
      ['색을 따라 출구를 찾자','Signifiers','Good','출구 이름이 어렵다면 색만 따라가면 된다. 가고 싶은 출구의 색을 찾는 것만으로 길을 찾을 수 있다.','교통'],
      ['Kiwi의 다크넛지','Affordance','bad','하단 체크박스를 선택하지 않으면 광고 메시지를 받게 되는 구조. 선택을 유도하는 방식이 불투명하다.','웹'],
      ['직관적인 택시 어플','Accessibility','Good','중요한 기능을 색과 글씨 크기로 강하게 강조한다. 운전 중에도 쉽고 빠르게 조작할 수 있도록 목적에 맞췄다.','모바일'],
      ['제한된 버튼만 있는 엘리베이터','Constraints','bad','올라가는 버튼이 보이지 않는다. 제약이 사용자의 다음 행동을 막아버린 사례.','공간'],
      ['식기세척기 온도에 따른 기능','Metaphor','Good','따로 설명이 없어도 아이콘만 보고 온도에 따라 어떤 효과가 있는지 알 수 있다. 선택에 도움이 되는 비유다.','제품'],
      ['원하지 않으신다면 돌아가세요','Forgiveness','Good','예상치 못하게 다른 계정의 스토리로 연결될 수 있는 상황에서, 인스타그램이 먼저 확인해준다.','모바일'],
      ['홈페이지에서 이미 놀이동산에 온 느낌','Visibility','Good','에버랜드 앱의 첫 화면. 다양한 공간으로 연결되기 전부터 현장에 온 듯한 기대를 만든다.'],
      ['이걸로 최근에 로그인했어요','Affordance','Good','가입에 사용한 계정을 잊기 쉬운 상황에서 가장 최근에 쓴 로그인 수단을 알려준다.'],
      ['이어서 번역하세요','Accessibility','Good','긴 문장이 잘렸을 때 로그인 후 이어서 번역할 수 있고, 기존 데이터도 유지된다.'],
      ['게임할 시간 없이 바쁘시죠?','UX Writing','Good','최근 플레이하지 않은 상황을 정확히 짚어 센스 있는 문구를 보낸다.'],

      '신박하지만 무거워서 열기가 힘들어요':'열어보라고 만들어놓고, 왜 이렇게 무거워요?','프라이탁':'열기 전부터 가방이 보이는 상자','스위스패스':'기차가 지금 어디쯤인지, 드디어 알려줍니다','공항에서 집까지 27분':'공항에 내리자마자 집 생각해주는 지도','3번 남았구나?':'교통카드가 제 잔여 횟수를 말해줬습니다','이메일이요?':'전화번호 칸에서 이메일을 찾는 사람','트램에서도 티켓을 구매하세요':'티켓 놓쳐도, 트램 안에서 살 수 있었습니다','땅콩 알러지 출입금지':'여기는 땅콩이 진심입니다','귀여운 신호등':'신호등도 이 동네 주민이었습니다','피드백 주세요':'화장실 앞에서 바로 기분을 묻는 이유','길을 잃었다':'화살표를 믿었다가 길을 잃었습니다','음, 저 내용은 좀 위협적이네요.':'핀터레스트는 먼저 사과부터 했습니다','현재 얼마나 혼잡한가요?':'지금 이 열차, 사람 얼마나 타고 있나요?','이렇게 디테일한 스위치는 처음이야':'스위치마다 담당 구역이 있었습니다','여기에 오지 마세요':'“두지 마세요”를 말보다 먼저 보여주는 법','친절한 구글지도씨':'뒤로 가기 전에, 한 번 더 물어봐주는 지도','설명 없이도 이해가 가능해요':'프랑스어는 몰라도, 이건 알겠습니다','3일을 선택했는데 왜 4일이?':'3일을 눌렀는데, 4일이 결제됐습니다','데자뷰?':'오류를 데자뷰라고 부르면 덜 민망해집니다','Wizz air 비행기 티켓':'비행기 티켓이 이렇게 친절할 일인가요?','간판에 이름 따위는 필요없다':'이름은 없어도, 여기가 어딘지는 압니다','색을 따라 출구를 찾자':'출구 이름 대신 색을 따라갔습니다','스웨덴 지하철에서 길찾기':'언어를 몰라도 지하철을 탈 수 있었습니다','갈아탈 노선이 한 눈에 보이는 스웨덴 지하철':'환승 정보가 이렇게 한눈에 들어옵니다','Kiwi의 다크넛지':'체크를 안 하면 광고가 옵니다','Bolt의 환영 알림':'낯선 도시에서 제일 먼저 반겨준 앱','직관적인 길 안내 표지판':'4차선 도로도 화살표 하나면 됩니다','노란색 소화기':'소화기가 꼭 빨개야만 할까요?','절약을 위한 스위치':'불을 꺼달라는 부탁이 예쁠 수도 있습니다','직관적인 택시 어플':'운전 중에도 한눈에 보여야 하는 이유','똑같이 생긴 많은 스위치':'이 중에 내가 끌 불이 있긴 한가요?','길에 놓여있는 타이어':'타이어 하나로 길을 막는 방법','이해가 어려운 피난대피방법':'안내문을 읽고 친구와 토론하게 됐습니다','음료 종류를 구분할 수 있는 버거킹 음료 뚜껑':'뚜껑이 음료를 구분해주려 했습니다','제한된 버튼만 있는 엘리베이터':'올라가는 버튼은 어디에 있나요?','커리어리 비밀번호 분실 메일':'비밀번호를 잊어도, 먼저 웃게 해준 메일','식기세척기 온도에 따른 기능':'온도만 봐도 모드가 보이는 식기세척기','어디가 마테호른인지 모르시겠다고요?':'마테호른을 못 찾아도, 망원경이 알려줍니다','우아한 경고':'젖은 손에게도 우아하게 말할 수 있습니다','비유를 상당히 잘쓰시네요':'슬랙이 비유로 상황을 풀어냈습니다','원하지 않으신다면 돌아가세요':'예상 못 한 이동이라면, 돌아갈 기회를 먼저','홈페이지에서 이미 놀이동산에 온 느낌':'앱을 켜자마자 에버랜드에 도착했습니다','이걸로 최근에 로그인했어요':'어느 계정인지 잊어도, 앱은 기억합니다','이어서 번역하세요':'번역이 잘려도, 다음 문장이 기다립니다','게임할 시간 없이 바쁘시죠?':'게임 못 한 제 마음을 읽은 알림','너무 위협적인데?':'이메일 확인하라는 말치고는 너무 무섭습니다','아직 조건을 충족시키지 못한건가?':'조건을 채웠는데도 왜 경고가 남아있죠?','최근이 대체 언제인가요..?':'“최근 로그인”이 대체 언제죠?','내가 왜 신청을 안했냐면..':'신청 안 한 이유를 진짜 물어봤습니다','네이버지도 하차알림':'알림이 틀릴 때도, 내가 고를 수 있게','광고문자를 받게 되는건가요?':'이 동의, 광고 문자까지 오는 건가요?','Slack 링크 미리보기':'링크 미리보기를 안 여는 이유까지 설명한 슬랙','저는 새 양말을 더 찾아볼래요':'광고 차단을 양말 얘기로 설명한 Arc','슬랙 사진오류':'사진이 안 올라가도, 먼저 칭찬해주는 슬랙','자동으로 날짜를 작성해주는 워드':'날짜 쓰는 일은 워드에게 맡겼습니다','휴대폰 인증인데 카카오':'휴대폰 인증이라더니 카카오톡이 왔습니다','소-름':'편한데, 어디까지 알고 있는 거예요?','신박한데..':'비밀번호가 네 자리라는 말, 아이콘이면 충분할까요?','안심을 주는 한마디':'수수료가 안 나간다는 말, 지금 해주세요','동의하고 싶지 않다면요?':'선택 동의라면서 선택지가 하나였습니다','금지하는 듯한 sign':'안내문이 너무 금지처럼 보일 때','본론부터 이야기하자면':'어려운 설명보다, 본론부터 말해줬습니다','오류 → 유도버튼. 좋은 프로세스!':'오류 화면에도 다음 길은 있어야 합니다','얘 안전벨트 안했어요!':'안전벨트 안 한 자리가 바로 보였습니다','기본 아닌가요?':'플러스가 왼쪽에 있으면 생기는 일','기분나쁘게 생각하지 말아주세요.':'로봇 판별도 기분 좋게 시킬 수 있습니다'
    };
    entries.forEach(entry=>{entry.originalTitle=entry.title; entry.title=betterTitles[entry.title]||entry.title; entry.lens=lenses[entry.category.split(' / ')[0]];});
    const categories=['All',...new Set(entries.flatMap(x=>x.category.split(' / ')))]; const statusLabel=status=>status==='?'?'Good & Bad':status==='bad'?'Needs work':'Good'; let selected='All'; const grid=document.querySelector('#grid'), search=document.querySelector('#search'), filters=document.querySelector('#filters'), resultCount=document.querySelector('#resultCount'), fieldLabel=document.querySelector('#fieldLabel');
    filters.innerHTML=categories.map(c=>`<button class="filter" aria-pressed="${c==='All'}" data-category="${c}">${c}<span>${c==='All'?entries.length:entries.filter(e=>e.category.split(' / ').includes(c)).length}</span></button>`).join('');
    function currentRecords(){ const q=search.value.trim().toLowerCase(); return entries.filter(e=>(selected==='All'||e.category.split(' / ').includes(selected))&&(`${e.title} ${e.originalTitle} ${e.body} ${e.category}`).toLowerCase().includes(q)); }
    function render(){ const shown=currentRecords(); grid.innerHTML=shown.map(e=>{const index=entries.indexOf(e); return `<article class="card" tabindex="0" role="button" aria-label="${e.title} 상세 보기" data-index="${index}"><div class="image-wrap"><img class="card-img" src="${e.image}" alt="${e.originalTitle} 관련 원본 기록 사진" loading="lazy"></div><div class="card-body"><div class="meta"><span class="chip ${e.status==='bad'?'bad':e.status==='?'?'question':''}">${e.category}</span><span>${statusLabel(e.status)}</span></div><h2>${e.title}</h2><p>${e.body}</p><div class="card-actions"><span class="open" aria-hidden="true">↗</span></div></div></article>`}).join(''); document.querySelector('#empty').style.display=shown.length?'none':'block'; resultCount.textContent=`${shown.length}개의 장면을 탐색 중`; fieldLabel.textContent=selected==='All'?'All observations':selected; }
    function openRecord(index){const x=entries[index];document.querySelector('#dialogContent').innerHTML=`<div class="meta"><span class="chip ${x.status==='bad'?'bad':x.status==='?'?'question':''}">${x.category}</span><span>${statusLabel(x.status)}</span></div><img class="modal-img" src="${x.image}" alt="${x.originalTitle} 관련 원본 기록 사진"><h2>${x.title}</h2><p class="body">${x.body}</p><div class="takeaway"><strong>WHAT I NOTICED</strong>${x.lens}</div>`;document.querySelector('#dialog').showModal()}
    filters.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;selected=b.dataset.category;document.querySelectorAll('.filter').forEach(x=>x.setAttribute('aria-pressed',x===b));render();document.querySelector('.field').scrollTo?.({top:0,behavior:'smooth'})}); search.addEventListener('input',render); grid.addEventListener('click',e=>{const card=e.target.closest('.card');if(card)openRecord(card.dataset.index)}); grid.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.closest('.card')){e.preventDefault();openRecord(e.target.closest('.card').dataset.index)}}); document.querySelector('.close').onclick=()=>document.querySelector('#dialog').close(); document.querySelector('#dialog').addEventListener('click',e=>{if(e.target.id==='dialog')e.currentTarget.close()}); render();
  </script>
